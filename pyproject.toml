[project]
name = "ai-career-coach-agent"
version = "0.1.0"
description = "A stateful single-agent AI career coach built with LangGraph and NVIDIA Nemotron."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langgraph>=1.2.11,<2",
  "langchain>=1.4.0,<2",
  "langchain-openai>=0.3.0,<1",
  "pydantic>=2.13,<3",
  "streamlit>=1.63,<2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=5.0",
  "ruff>=0.16.6,<0.17",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
